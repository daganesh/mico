[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mico"
version = "0.1.0"
description = "Mission Control -- local-first operational workspace for engineering managers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "typer>=0.15,<1",
    "rich>=13,<14",
    "pyyaml>=6,<7",
    "jinja2>=3,<4",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["mico"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["mico"]
strict = false
ignore_missing_imports = true
