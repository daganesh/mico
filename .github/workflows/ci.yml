name: CI

# Required status checks for branch protection on main (see
# docs/mico-implementation-design.md, "Delivery Process: Commits, PRs, and
# the CI Gate"): lint, typecheck, test, layer-check, build, review-gate.
# A PR may not merge while any of these is red.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: mypy mico

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      # Diff-coverage enforcement (fail on a coverage regression for touched
      # files specifically, per the Delivery Process table) is deferred to a
      # later task once there's a coverage baseline to diff against; for now
      # this reports coverage without gating on it.
      - run: pytest -q --cov=mico --cov-report=term-missing

  layer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_layers.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install build
      - run: python -m build

  # Automated code-review gate (Delivery Process: "Automated code-review
  # gate"). Authenticates via Anthropic Workload Identity Federation (WIF) --
  # the GitHub Actions OIDC token is exchanged for a short-lived Anthropic
  # access token, so there is no static ANTHROPIC_API_KEY to store, rotate,
  # or leak. The federation rule/org/service-account/workspace IDs are read
  # from repo variables (Settings -> Secrets and variables -> Actions ->
  # Variables): ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
  # ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID. These are
  # identifiers, not secrets (Anthropic's WIF docs are explicit they're
  # safe to commit) -- kept as variables rather than literals here so
  # rotating the rule never requires a workflow-file change.
  review-gate:
    if: github.event_name == 'pull_request'
    needs: [lint, typecheck, test, layer-check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # required to fetch the GitHub OIDC token for WIF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Automated PR review (Claude Code, via Workload Identity Federation)
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.
            Read .github/review-checklist.md in full and follow it exactly, using
            docs/mico-implementation-design.md and the PRD/AD docs it references
            for context on what the PR's linked task ID is supposed to implement.

            Post your findings as a top-level PR comment via `gh pr comment`
            (don't submit review text as a chat message). Then, and only then,
            return the structured JSON result requested by the schema -- verdict
            is "FAIL" if and only if the checklist surfaced a high/critical finding.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"blocking_issues":{"type":"array","items":{"type":"string"}}},"required":["verdict"]}'
      - name: Enforce review verdict
        run: |
          VERDICT=$(echo '${{ steps.review.outputs.structured_output }}' | jq -r '.verdict // "FAIL"')
          echo "Review verdict: ${VERDICT}"
          if [ "${VERDICT}" != "PASS" ]; then
            echo "::error::Automated review verdict was ${VERDICT} -- see the PR comment for findings."
            exit 1
          fi
