name: Claude Feature Implementation

# Triggered when a maintainer approves an issue for automated implementation
# by adding the `claude-implement` label. Only users with triage/write
# access can add labels, so the trigger surface is already restricted to
# collaborators -- but the issue title/body itself may have been authored
# by an untrusted external reporter, and it is fed to an agentic coding
# step with repo write access below. Keep the Bash allowlist narrow (see
# `claude_args`) so a prompt-injected issue body can't do more than run the
# repo's own lint/type/test commands.
on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement-issue:
    if: github.event.label.name == 'claude-implement'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to fetch the GitHub OIDC token for Anthropic WIF
      contents: write
      pull-requests: write
      issues: write # only used to leave a comment on the issue if implementation fails
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -e ".[dev]"

      - name: Run Claude to Implement & Test
        id: implement
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            ISSUE TITLE: ${{ github.event.issue.title }}

            ISSUE BODY:
            ${{ github.event.issue.body }}

            The repository is already checked out in the current working
            directory, with dependencies installed. Use
            docs/mico-implementation-design.md and the PRD/AD docs it
            references for context on the codebase's layering
            (mico/brain, mico/logic, mico/ui) and ABC boundaries.

            Instructions:
            1. Locate the relevant files in the repository.
            2. Implement the requested feature or bug fix, respecting the
               existing layer/ABC boundaries.
            3. Write automated tests under tests/ covering your changes.
            4. Run `ruff check .`, `mypy mico`, and
               `pytest -q --cov=mico --cov-report=term-missing` yourself
               and fix anything that fails before finishing.
            5. Do not break any existing functionality.
            6. Leave your changes in the working tree (do not push or open
               a PR yourself -- a later step does that).
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pip:*),Bash(ruff:*),Bash(mypy:*),Bash(pytest:*),Bash(git:*)"

      - name: Verify Test Suite
        run: |
          ruff check .
          mypy mico
          pytest -q --cov=mico --cov-report=term-missing

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # NOTE: intentionally NOT the default GITHUB_TOKEN. PRs (and
          # commits) created with GITHUB_TOKEN do not trigger other
          # workflows, which would silently skip the `review-gate` job in
          # ci.yml for every PR this workflow opens. CLAUDE_IMPLEMENT_PR_TOKEN
          # must be a token that can push and open PRs, e.g. a fine-grained
          # PAT (Contents: write, Pull requests: write) belonging to a
          # dedicated bot account, or a GitHub App installation token minted
          # via actions/create-github-app-token. Ask DevOps to add whichever
          # is standard for this org as a repo secret before enabling this
          # workflow.
          token: ${{ secrets.CLAUDE_IMPLEMENT_PR_TOKEN }}
          commit-message: "feat: automated implementation for #${{ github.event.issue.number }}"
          title: "Closes #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            Automated implementation generated by Claude Code in response to
            issue #${{ github.event.issue.number }}.

            ### Changes Made
            - Automated implementation of the requested issue.
            - Automated tests written and verified (ruff, mypy, pytest all
              green as of this PR's opening commit).

            Closes #${{ github.event.issue.number }}
          branch: "claude/issue-${{ github.event.issue.number }}"
          base: main

      - name: Comment on Issue if Implementation Failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Automated implementation for this issue failed in [workflow run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). A maintainer will need to review manually.`,
            })
